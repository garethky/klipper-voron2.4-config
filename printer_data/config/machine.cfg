[include btt-octopus-pins.cfg]

# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Hotend heater pin                    [extruder] section
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Stepper Z1 enable pin                [stepper_z1] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_240050000F51383438343939-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 4.0 # try lower SQV for Nextruder

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: MOT0_STEP
dir_pin: !MOT0_DIR
enable_pin: !MOT0_EN
rotation_distance: 40
microsteps: 256
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 286
position_max: 286
homing_speed: 50   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: MOT0_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
diag_pin: ^ESTOP0
driver_SGTHRS: 125
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: MOT1_STEP
dir_pin: !MOT1_DIR
enable_pin: !MOT1_EN
rotation_distance: 40
microsteps: 256
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 50  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: MOT1_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
diag_pin: ^ESTOP1
driver_SGTHRS: 125
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: MOT2_STEP
dir_pin: !MOT2_DIR
enable_pin: !MOT2_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ESTOP7
#position_endstop: 0
position_max: 260
position_min: -5
homing_speed: 5
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: MOT2_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: MOT3_STEP
dir_pin: MOT3_DIR
enable_pin: !MOT3_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: MOT3_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: MOT4_STEP
dir_pin: !MOT4_DIR
enable_pin: !MOT4_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: MOT4_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: MOT5_STEP
dir_pin: MOT5_DIR
enable_pin: !MOT5_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: MOT5_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
step_pin: MOT6_STEP
dir_pin: !MOT6_DIR
enable_pin: !MOT6_EN
# Prusa MK4 Nextruderstepper
# Impirically I get rotation_distance = 8mm, 400 steps per mm
rotation_distance: 8
microsteps: 16
#full_steps_per_rotation: 200  #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 2.4
heater_pin: HE1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#Thermistor NTC 100k
sensor_type: Generic 3950  #It's a "Thermistor NTC 100k"
sensor_pin: T2
# stop 24V LED from flickering
pwm_cycle_time: 0.01
min_temp: 10
max_temp: 310
max_power: 1.0
min_extrude_temp: 10.1 #160
## PID parameters:
control: pid
pid_Kp: 32.550
pid_Ki: 2.893
pid_Kd: 91.547
# allow long extruder moves for filament loading/unloading
max_extrude_only_distance: 150.0

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: MOT6_CS
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[temperature_sensor extruder_heatbreak]
gcode_id: HT
sensor_type: Generic 3950
sensor_pin: T3
min_temp: 0
max_temp: 120



#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: HE0
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: TB
smooth_time: 2.0  # for some reason I get a very regular flucutation on this channel even when not heating
# stop the lights from flickering by switching above the power line frequency
pwm_cycle_time: 0.01666 #60Hz
#pwm_cycle_time: 0.01   # 100Hz, Max = (1.0 / 120hz = 0.0083)
#pwm_cycle_time: 0.008333  #120Hz
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 0.75  #TODO: get bed heater wattage
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

[verify_heater heater_bed]
# The big bed increases in temp more slowly up to 110C so allow less temp increase in 60s
heating_gain: 1

[temperature_sensor top_bed]
gcode_id: TTB
sensor_type: Generic 3950
sensor_pin: T0
min_temp: 0
max_temp: 120

[temperature_sensor enclosure]
gcode_id: ENC
sensor_type: Generic 3950
sensor_pin: T1
min_temp: 0
max_temp: 120

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
pin: FAN0
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start.
off_below: 0.10
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

##  Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: FAN1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##  Controller fans
[controller_fan controller_fan1]
pin: FAN4
kick_start_time: 0.5
heater: heater_bed
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

[controller_fan controller_fan2]
pin: FAN5
kick_start_time: 0.5
heater: heater_bed
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

##  24V re-circulating filter fans
[heater_fan filter_fan1]
pin: FAN3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 1.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.00
off_below: 0.10
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

#####################################################################
#   Electronics Temperatures
#####################################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
#[output_pin caselight]
##Octopus 1.0 & 1.1, Octopus PRO 1.0
#pin: PB10
##Octopus PRO 1.1
#pin: PB0
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800
gcode:
   TURN_OFF_HEATERS
   M84
   _SET_CASE_LIGHTS_DIM

[force_move]
enable_force_move: True

#[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position:-10,-10
#speed:100
#z_hop:0

[homing_override]
axes: xyz
gcode:
  _HOMING_OVERRIDE {% if 'X' in params %} X=1{%endif%}{% if 'Y' in params %} Y=1{%endif%}{% if 'Z' in params %} Z=1{%endif%}

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
##  Gantry Corners for 300mm Build
##  Uncomment for 300mm build
## Nextruder mount resctricts max to be (286, 300)
gantry_corners:
   -60,-10
   #-74, -10
   360,370
##  Probe points
points:  # x15 y15 -> x275 y275
   50,25
   50,250
   250,250
   250,25
speed: 200
horizontal_move_z: 5
retries: 6
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   Mesh Bed Leveling
#####################################################################

[bed_mesh]
speed: 200
horizontal_move_z: 0.5
mesh_min: 0, 0
mesh_max: 285,277
fade_start: 0.6
fade_end: 10.0
probe_count: 10, 10
algorithm: bicubic
adaptive_margin: 0
## Mag Bed has issues with the spring steel sheet flexing over the magnets
# make the 9 magnets into faulty regions
faulty_region_1_min: 10, 260
faulty_region_1_max: 34, 284
faulty_region_2_min: 135, 260
faulty_region_2_max: 159, 284
faulty_region_3_min: 260, 260
faulty_region_3_max: 284, 284
faulty_region_4_min: 10, 135
faulty_region_4_max: 34, 159
faulty_region_5_min: 135, 135
faulty_region_5_max: 159, 159
faulty_region_6_min: 260, 135
faulty_region_6_max: 284, 159
faulty_region_7_min: 10, 10
faulty_region_7_max: 34, 34
faulty_region_8_min: 135, 10
faulty_region_8_max: 159, 34
faulty_region_9_min: 260, 10
faulty_region_9_max: 284, 34

[exclude_object]

#####################################################################
#   Resonance Compensation
#####################################################################

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
axes_map: z, x, y

[resonance_tester]
accel_chip: adxl345
probe_points:
    140, 130, 100  # approximately in the center

[input_shaper]
shaper_freq_x: 83.4
shaper_type_x: zv
shaper_freq_y: 40.6
shaper_type_y: mzv

#####################################################################
#  LED Case Lights
#####################################################################
[output_pin left_case_light]
pin: HE2
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.03
shutdown_value: 0.03

[output_pin right_case_light]
pin: HE3
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.03
shutdown_value: 0.03

[output_pin gantry_light]
pin: FAN2
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.03
shutdown_value: 0.03

