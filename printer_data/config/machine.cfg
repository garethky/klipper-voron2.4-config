#[load_cell]
[load_cell_probe]
sensor_type: hx717
dout_pin: TFT_4
sclk_pin: TFT_3
counts_per_gram: 87.944082
reference_tare_counts: 630292
safety_limit: 5000
trigger_force: 100
continuous_tare_trigger_force: 40
continuous_tare_highpass: 0.8
continuous_tare_lowpass: 100
continuous_tare_notch: 50, 60
continuous_tare_notch_quality: 2
settling_time: 0.5
z_offset: 0.
speed: 2.5
lift_speed: 8
samples: 1
samples_result: average
tap_filter_notch: 60
tap_filter_notch_quality: 2.0
# Prusa are using a vanishingly small 0.2mm retract distance:
# https://github.com/prusa3d/Prusa-Firmware-Buddy/blob/f26c91ba57b004e570a73fb9c9cda0ce3e433b40/include/marlin/Configuration_MK4.h#L1003
sample_retract_dist: 0.5
samples_tolerance: 0.01
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 170 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}