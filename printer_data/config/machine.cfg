[include btt-octopus-pins.cfg]

# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Hotend heater pin                    [extruder] section
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Stepper Z1 enable pin                [stepper_z1] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_240050000F51383438343939-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 4.0 # try lower SQV for Nextruder

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: MOT0_STEP
dir_pin: !MOT0_DIR
enable_pin: !MOT0_EN
rotation_distance: 40
microsteps: 256
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 285.5
position_max: 285.5
homing_speed: 50   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: MOT0_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
diag_pin: ^ESTOP0
driver_SGTHRS: 125
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: MOT1_STEP
dir_pin: !MOT1_DIR
enable_pin: !MOT1_EN
rotation_distance: 40
microsteps: 256
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300
position_min: -3
homing_speed: 50  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: MOT1_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
diag_pin: ^ESTOP1
driver_SGTHRS: 125
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: MOT2_STEP
dir_pin: !MOT2_DIR
enable_pin: !MOT2_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 256
position_max: 260
position_min: -5
#position_min: 0
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 0
# with load cell probing
#endstop_pin: probe:z_virtual_endstop
# without load cell probing
endstop_pin: ESTOP7
position_endstop: 0

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: MOT2_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: MOT3_STEP
dir_pin: MOT3_DIR
enable_pin: !MOT3_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 256

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: MOT3_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: MOT4_STEP
dir_pin: !MOT4_DIR
enable_pin: !MOT4_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 256

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: MOT4_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: MOT5_STEP
dir_pin: MOT5_DIR
enable_pin: !MOT5_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 256

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: MOT5_CS
interpolate: false
driver_TBL: 1  #2
driver_TOFF: 3  #3
driver_HSTRT: 1  #0
driver_HEND: 3  #5
run_current: 0.976  #peak 1.38A
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
step_pin: MOT6_STEP
dir_pin: !MOT6_DIR
enable_pin: !MOT6_EN
# Prusa MK4 Nextruderstepper
# Impirically I get rotation_distance = 8mm, 400 steps per mm
rotation_distance: 8
microsteps: 16
#full_steps_per_rotation: 200  #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 2.4
heater_pin: HE1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#Thermistor NTC 100k
sensor_type: Generic 3950  #It's a "Thermistor NTC 100k"
sensor_pin: T2
# stop 24V LED from flickering
pwm_cycle_time: 0.01
min_temp: 10
max_temp: 310
max_power: 1.0
min_extrude_temp: 10.1 # allow low temperature extrusion moves to retract before probing
## PID parameters:
control: pid
pid_Kp: 32.550
pid_Ki: 2.893
pid_Kd: 91.547
# allow long extruder moves for filament loading/unloading
max_extrude_only_distance: 150.0

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: MOT6_CS
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[temperature_sensor extruder_heatbreak]
gcode_id: HT
sensor_type: Generic 3950
sensor_pin: T3
min_temp: 0
max_temp: 120



#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: HE0
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: TB
smooth_time: 2.0
# stop the lights from flickering by switching above the power line frequency
pwm_cycle_time: 0.01666 #60Hz
# max_power: 0.6  # without heatsink, based on testing, higher settings cause the SSR to cut out
max_power: 1.0 # with heatsink
min_temp: 0
max_temp: 120
control: pid
# Tuned at 85C after a heat soak
pid_Kp: 60.826
pid_Ki: 6.336
pid_Kd: 145.982

[verify_heater heater_bed]
# The big bed increases in temp more slowly up to 110C so allow less temp increase in 60s
heating_gain: 1

[temperature_sensor top_bed]
gcode_id: TTB
sensor_type: Generic 3950
sensor_pin: T0
min_temp: 0
max_temp: 120

#[temperature_sensor enclosure]
#gcode_id: ENC
#sensor_type: Generic 3950
#sensor_pin: T1
#min_temp: 0
#max_temp: 120

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
#pin: FAN0  # FAN0 Port is Busted!!
pin: FAN5
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start.
off_below: 0.10
hardware_pwm: False
#cycle_time: 0.00004 # 25 kHz

##  Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: FAN1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##  Controller fans
[controller_fan controller_fan1]
pin: FAN4
kick_start_time: 0.5
heater: heater_bed
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

#Disabled so I can steal a port for the print fan
#[controller_fan controller_fan2]
#pin: FAN5
#kick_start_time: 0.5
#heater: heater_bed
#hardware_pwm: True
#cycle_time: 0.00004 # 25 kHz

##  24V re-circulating filter fans
[heater_fan filter_fan1]
pin: FAN3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 1.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.00
off_below: 0.10
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz

#####################################################################
#   Electronics Temperatures
#####################################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
#[output_pin caselight]
##Octopus 1.0 & 1.1, Octopus PRO 1.0
#pin: PB10
##Octopus PRO 1.1
#pin: PB0
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 4000  # extra long value for testing thermal expansion
#timeout: 1800  # 30 minutes
gcode:
   TURN_OFF_HEATERS
   M84
   SET_CASE_LIGHTS_DIM

[force_move]
enable_force_move: True

[homing_override]
axes: xyz
gcode:
  _HOMING_OVERRIDE {% if 'X' in params %} X=1{%endif%}{% if 'Y' in params %} Y=1{%endif%}{% if 'Z' in params %} Z=1{%endif%}

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
##  Gantry Corners for 300mm Build
##  Uncomment for 300mm build
## Nextruder mount resctricts max to be (286, 300)
gantry_corners:
   #-60,-10
   -51, 5  # its at the front of the belt
   341, 365  #(285+56, 300 + 65)
##  Probe points
points:  # x15 y15 -> x275 y275
   5, 5
   5, 275
   280, 275
   280, 5

##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
#gantry_corners:
#   -60,-10
#   410,420
##  Probe points
#points:
#   50,25
#   50,275
#   300,275
#   300,25

speed: 200
horizontal_move_z: 5
retries: 6
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   Resonance Compensation
#####################################################################

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
axes_map: z, x, y

[resonance_tester]
accel_chip: adxl345
probe_points:
    140, 130, 100  # approximately in the center

[input_shaper]
shaper_freq_x: 83.4
shaper_type_x: zv
shaper_freq_y: 40.6
shaper_type_y: mzv

#####################################################################
#  LED Case Lights
#####################################################################
[output_pin left_case_light]
pin: HE2
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.03
shutdown_value: 0.03

[output_pin right_case_light]
pin: HE3
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.03
shutdown_value: 0.03

[output_pin gantry_light]
pin: FAN2
pwm: True
hardware_pwm: True
cycle_time: 0.00004 # 25 kHz
value: 0.015
shutdown_value: 0.015

#####################################################################
#   Mesh Bed Leveling
#####################################################################

[bed_mesh]
speed: 200
horizontal_move_z: 0.2 # prusa uses 0.2: https://github.com/prusa3d/Prusa-Firmware-Buddy/blob/f26c91ba57b004e570a73fb9c9cda0ce3e433b40/include/marlin/Configuration_MK4.h#L1004C35-L1004C75
mesh_min: 0, 0
mesh_max: 285,285
adaptive_margin: 5
# dont use this, all of the z positions on the mesh are absolute
# zero_reference_position: 130, 140
# Use agressive move splitting to fight high / low spots
move_check_distance: 3.0
# high values _may_ cause streaks
# I paid for 1 micron accuracy (with my blood, sweat and tears), I want 1 micron adjustments
split_delta_z: 0.01
fade_start: 0.6
fade_end: 10.0
# use 10 x 10 probes
probe_count: 10
# more mesh PPS allows more exact bicubic curve expression
# 285 / 10 / 5 = 7.1mm mesh resolution
mesh_pps: 5
# bicubic this is the only option for high probe counts
algorithm: bicubic
# https://klipper.discourse.group/t/experimental-mesh-leveling-changes/3401
# https://www.reddit.com/r/klippers/comments/vulqvq/followup_to_bed_shows_as_very_much_not_levelbed/
# more tension = _over_ compensation?
bicubic_tension: 0.2  # default
faulty_region_1_min:12, 4
faulty_region_1_max:30, 22
faulty_region_2_min:137, 4.5
faulty_region_2_max:155, 22.5
faulty_region_3_min:262, 5
faulty_region_3_max:280, 23
faulty_region_4_min:11.5, 254
faulty_region_4_max:29.5, 272
faulty_region_5_min:136.25, 254.5
faulty_region_5_max:154.25, 272.5
faulty_region_6_min:261, 255
faulty_region_6_max:279, 273
faulty_region_7_min:12.25, 129
faulty_region_7_max:30.25, 147
faulty_region_8_min:137.375, 129.5
faulty_region_8_max:155.375, 147.5
faulty_region_9_min:262.5, 130
faulty_region_9_max:280.5, 148

[stepper_enable]