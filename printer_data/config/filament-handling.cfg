[gcode_macro _create_all_filaments]
gcode:
    SETUP_FILAMENT NAME=PLA EXTRUDER=215 BED=60 PROBE_TEMP=170
    SETUP_FILAMENT NAME=PETG EXTRUDER=230 BED=85 PROBE_TEMP=170
    SETUP_FILAMENT NAME=ASA EXTRUDER=260 BED=100 PROBE_TEMP=190
    SETUP_FILAMENT NAME=PC EXTRUDER=275 BED=100 PROBE_TEMP=190
    SETUP_FILAMENT NAME=PVB EXTRUDER=215 BED=75  PROBE_TEMP=140
    SETUP_FILAMENT NAME=ABS EXTRUDER=255 BED=100 PROBE_TEMP=170
    SETUP_FILAMENT NAME=HIPS EXTRUDER=220 BED=100 PROBE_TEMP=160
    SETUP_FILAMENT NAME=PP EXTRUDER=240 BED=100 PROBE_TEMP=160
    SETUP_FILAMENT NAME=FLEX EXTRUDER=240 BED=50 PROBE_TEMP=140

