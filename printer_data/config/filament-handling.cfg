################################################################################
# Loading, Unloading and Purging
################################################################################
[gcode_macro PURGE_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=PURGE_FILAMENT
    PARK_FOR_SERVICE
    WARM_UP_NOZZLE
    HEAT_IF_NEEDED
    G91
    # 30mm @ 3m/s
    G1 E30 F{3 * 60}
    RESTORE_GCODE_STATE NAME=PURGE_FILAMENT

# ref for the nextruder: https://github.com/prusa3d/Prusa-Firmware-Buddy/blob/b3ee47aa573f4d9b4af82d7a6963f43ab37ccc08/include/marlin/Configuration_XL_adv.h#L1416
[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT
    PARK_FOR_SERVICE
    WARM_UP_NOZZLE
    HEAT_IF_NEEDED
    # ideally there would be a pause here to ask the user to load filament into the extruder gears
    G91
    # 30mm @ 5.4mm/s - load filament into extruder gears
    G1 E30 F{5.4 * 60}
    # 50mm @ 18mm/s - load filament into melt zone
    G1 E50 F{18 * 60}
    # purge filament, only this step requires heating
    PURGE_FILAMENT
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT
    PARK_FOR_SERVICE
    WARM_UP_NOZZLE
    HEAT_IF_NEEDED
    G91
    # Purge filament, flush melt zone before retracting
    # 15mm @ 24mm/s
    G1 E15 F{24 * 60}
    # https://github.com/prusa3d/Prusa-Firmware-Buddy/blob/b3ee47aa573f4d9b4af82d7a6963f43ab37ccc08/lib/Marlin/Marlin/src/feature/pause.cpp#L365
    # 20mm @ 27mm/s
    G1 E-20 F{27 * 60} # retract fast, to pull hot filament out of the melt zone
    # 30mm @ 5mm/s
    G1 E-30 F{5 * 60} # retract slowly to cool filament tip
    # 105mm @ 27mm/s
    G1 E-50 F{105 * 60} # eject filament completly from extruder
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT

