[printer voron2.4]
z_babystep_values: 0.01, 0.001

## Preheat overrides (they dont get used though)
[preheat PLA]
extruder: 215
heater_bed: 60

[preheat PETG]
extruder: 230
heater_bed: 85

[preheat ASA]
extruder: 260
heater_bed: 100

[preheat PC]
extruder: 275
heater_bed: 100

