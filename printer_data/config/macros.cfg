gcode:
    {% for name1 in printer %}
        { action_respond_info("printer['%s'] = %s" % (name1, printer[name1] | pprint)) }
    {% endfor %}

[gcode_macro DUMP_PAUSE_STATE]
gcode:
   {action_respond_info("[pause_resume].is_paused = %s" % (printer['pause_resume'].is_paused | string)) }
   {action_respond_info("[virtual_sdcard] = %s" % (printer['virtual_sdcard'] | pprint | string)) }
   
[gcode_macro DUMP_EXTRUDER]
gcode:
   {action_respond_info("printer['extruder'] = %s" % (printer['extruder'] | pprint)) }

[gcode_macro DUMP_EXTRUDER1]
gcode:
   {action_respond_info("printer['extruder1'] = %s" % (printer['extruder1'] | pprint)) }

[gcode_macro DUMP_TOOLHEAD]
gcode:
   {action_respond_info("printer['toolhead'] = %s" % (printer['toolhead'] | pprint)) }

[gcode_macro DUMP_SAVE_VARIABLES]
gcode:
    {% for name2 in printer["save_variables"] %}
        { action_respond_info("printer['%s'].%s = %s" % ("save_variables", name2, printer["save_variables"][name2])) }
    {% else %}
        { action_respond_info("printer['%s'] = %s" % ("save_variables", printer["save_variables"])) }
    {% endfor %}

# this needs access to print start etc.
#[include pa-cal.cfg]

[gcode_macro HEAT_IF_NEEDED]
gcode:
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if ACTUAL_TEMP > (TARGET_TEMP + 2) or ACTUAL_TEMP < (TARGET_TEMP - 2) %}
        HEAT_EXTRUDER_AND_WAIT
    {% endif %}

[gcode_macro WARM_UP_NOZZLE]
gcode:
    PREHEAT_EXTRUDER

[gcode_macro WARM_NOZZLE_TO_PROBE_TEMP]
gcode:
    M104 S{printer.extruder.filament.probe_temp}

[gcode_macro COOLDOWN_NOZZLE]
gcode:
    M104 S0

[gcode_macro WARM_UP_BED]
gcode:
    PREHEAT_BED

[gcode_macro FREEZE]
gcode:
    TURN_OFF_HEATERS

[gcode_macro PROBE_TEMP_SAFETY_CHECK]
gcode:
    {% set PROBE_TEMP = printer.extruder.filament.probe_temp %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

# scrub the nozzle on the brush
[gcode_macro SCRUB_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=SCRUB_NOZZLE
    {% set RETURN = params.RETURN | default(True) %}
    NOZZLE_SCRUB BRUSH_POSITION="80,294" BRUSH_SIZE="50,6" PASSES=6 TRAVEL_HEIGHT=3 TRAVEL_SPEED=500 WIPE_SPEED=200 WIPE_HEIGHT=1.0 LIFT_SPEED=10 RETURN={RETURN}
    NOZZLE_SCRUB BRUSH_POSITION="80,294" BRUSH_SIZE="50,6" PASSES=5 TRAVEL_HEIGHT=3 TRAVEL_SPEED=500 WIPE_SPEED=200 WIPE_HEIGHT=1.5 LIFT_SPEED=10 RETURN={RETURN}
    RESTORE_GCODE_STATE NAME=SCRUB_NOZZLE

# Move the probe to a new tapping location
[gcode_macro _TAP_AND_MOVE]
gcode:
    SAVE_GCODE_STATE NAME=_TAP_AND_MOVE
    # relative move right 1.5mm
    G91
    G1 X1.5
    RESTORE_GCODE_STATE NAME=_TAP_AND_MOVE

# switch to scrubbing
[gcode_macro _SET_PROBE_CLEANER_SCRUB]
gcode:
    SET_GCODE_VARIABLE MACRO=PROBE_CLEANER VARIABLE=METHOD VALUE=SCRUB_NOZZLE

#switch to tap and move
[gcode_macro _SET_PROBE_CLEANER_TAP]
gcode:
    SET_GCODE_VARIABLE MACRO=PROBE_CLEANER VARIABLE=METHOD VALUE=_TAP_AND_MOVE

# This macro can be controlled to either scrub the nozzle on the scrubber brush OR perform move
[gcode_macro PROBE_CLEANER]
variable_parameter_METHOD : "SCRUB_NOZZLE"
gcode:
    SAVE_GCODE_STATE NAME=PROBE_CLEANER
    {METHOD} 
    RESTORE_GCODE_STATE NAME=PROBE_CLEANER

[gcode_macro _RETRACT_BEFORE_PROBING]
gcode:
    SAVE_GCODE_STATE NAME=_RETRACT_IF_NEEDED
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% if ACTUAL_TEMP > 165.0 %}
        M83
        G1 E-3 F2400 ; retraction for nozzle cleanup before probing
        G92 E0 ; reset extruder position
        { action_respond_info('Extruder retracted for ooze prevention') }
    {% endif %}
    RESTORE_GCODE_STATE NAME=_RETRACT_IF_NEEDED

[gcode_macro _DERETRACT_AND_PURGE]
gcode:
    SAVE_GCODE_STATE NAME=_DERETRACT_AND_PURGE
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% if ACTUAL_TEMP > 170 %}
        M83
        G0 E30 F200
        G92 E0 ; reset extruder position
    {% endif %}
    RESTORE_GCODE_STATE NAME=_DERETRACT_AND_PURGE
    
