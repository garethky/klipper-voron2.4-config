[include filament-handling.cfg]

#####################################################################
#   Macros
#####################################################################

[gcode_macro HOME_IF_NEEDED]
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro PARK_REAR]
gcode:
    SAVE_GCODE_STATE NAME=PARK_REAR
    HOME_IF_NEEDED
    ; park the head at the front of the printer
    G90
    G1 X75 Y294 F5000.0
    RESTORE_GCODE_STATE NAME=PARK_REAR

[gcode_macro PARK_CENTER]
gcode:
    SAVE_GCODE_STATE NAME=PARK_CENTER
    HOME_IF_NEEDED
    ; park the head at the front of the printer
    G90
    G1 X150 Y120 F5000.0
    RESTORE_GCODE_STATE NAME=PARK_CENTER

[gcode_macro PARK_FRONT]
gcode:
    SAVE_GCODE_STATE NAME=PARK_FRONT
    HOME_IF_NEEDED
    ; park the head at the front of the printer
    G90
    G1 X150 Y0 F5000.0
    RESTORE_GCODE_STATE NAME=PARK_FRONT

[gcode_macro PARK_OOZING]
gcode:
    SAVE_GCODE_STATE NAME=PARK_OOZING
    HOME_IF_NEEDED
    ; park the head at the back of the printer near the nozzle brush
    G90
    G1 X75 Y294 Z2 F5000.0
    RESTORE_GCODE_STATE NAME=PARK_OOZING

[gcode_macro SAFE_LIFT_Z]
gcode:
    SAVE_GCODE_STATE NAME=SAFE_LIFT_Z
    HOME_IF_NEEDED
    # user parameters
    {% set z_height      = params.Z|default(0.0)|float %}
    {% set speed         = params.F|default(printer.gcode_move.speed)|int %}
    {% set axis_maximum  = printer.toolhead.axis_maximum %}
	{% set position      = printer.toolhead.position%}

    # compute the minimum safe upward move size
    {% set z_height = [z_height, axis_maximum.z - position.z]|min|float%}
    G91
    G1 Z{z_height} F{speed}
    RESTORE_GCODE_STATE NAME=SAFE_LIFT_Z

# lift Z to at least the provided value
[gcode_macro SAFE_LIFT_Z_ABSOLUTE]
gcode:
    SAVE_GCODE_STATE NAME=SAFE_LIFT_Z_MIN
    HOME_IF_NEEDED
    # user parameters
    {% set z_height      = params.Z|default(0.0)|float %}
    {% set speed         = params.F|default(printer.gcode_move.speed)|int %}
    {% set axis_maximum  = printer.toolhead.axis_maximum %}
	{% set position      = printer.toolhead.position%}

    # compute the minimum safe upward move size
    {% if position.z < z_height %}
        G90
        G1 Z{z_height} F{speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=SAFE_LIFT_Z_MIN

[gcode_macro PARK_FOR_SERVICE]
gcode:
    SAFE_LIFT_Z_ABSOLUTE Z=100
    PARK_FRONT

####### Build Sheets #######
[gcode_macro INSTALL_TEXTURED_SHEET]
gcode:
    INSTALL_BUILD_SHEET NAME="Textured PEI Sheet"

[gcode_macro INSTALL_SMOOTH_SHEET]
gcode:
    INSTALL_BUILD_SHEET NAME="Smooth PEI Sheet"

[gcode_macro INSTALL_G10_SHEET]
gcode:
    INSTALL_BUILD_SHEET NAME="Smooth G10 Sheet"

[gcode_macro PURGE_LINE]
gcode:
    SAVE_GCODE_STATE NAME=PURGE_LINE
    {% set purge_start_x = params.PRINT_START_X|default(5.0)|float %}
    {% set purge_start_y = params.PRINT_START_Y|default(-3.0)|float %}

    {% if (purge_start_x + 80) >= printer.toolhead.axis_maximum.x %}
        {% set purge_start_x = printer.toolhead.axis_maximum.x - 81 %}
    {% endif %}

    ; purge/prime nozzle
    G90 ; use absolute coordinates
    ; go to the start of the print area, but -5 in Y
    G1 X{purge_start_x} Y{purge_start_y} Z0.3 F{400 * 60} ; go to the purge start location
    G91 ; relative coordinates
    M83 ; extruder relative mode
    G92 E0.0
    G1 X40.0 E10.0 F{17 * 60}  ; narrow start line
    G1 X40.0 E13.0 F{17 * 60}  ; priming thick outro line
    G92 E0.0
    G1 X10.0 F{400 * 60}    ; move the nozzle away from the end of the purge line so the print doesnt drag the nozzle back throught it.
    # set speed for the subsequent travel move to be quick
    G1 F{400 * 60}

    RESTORE_GCODE_STATE NAME=PURGE_LINE

# this macro moves to a safe position (where the purge line will happen) and probes to clear ooze from the nozzle
[gcode_macro TAP_CHECK]
gcode:
    SAVE_GCODE_STATE NAME=TAP_CHECK
    {% set tap_start_x = params.PRINT_START_X|default(5.0)|float %}
    {% set tap_start_y = params.PRINT_START_Y|default(-3.0)|float %}
    G90 ; use absolute coordinates
    G1 Z2.0 F{10 * 60}
    G1 X{tap_start_x} Y{tap_start_x} F{400 * 60}
    PROBE SAMPLES=2 # get 2 good probe samples
    RESTORE_GCODE_STATE NAME=TAP_CHECK

[gcode_macro PRINT_WARMUP]
description: Perform initial homing and heating tasks
variable_parameter_EXTRUDER_TEMP : 0
variable_parameter_BED_TEMP : 0
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}

    CLEAR_PAUSE
    BED_MESH_CLEAR

    M140 S{BED_TEMP}                      ; set bed temprature
    M109 S140                             ; load cell requires warm nozzle
    ;M106 S64                             ; Enable the part cooling fan to keep the probe and cooling ducts cool during heat-up
    HOME_IF_NEEDED                        ; home all axes but dont QGL
    SAFE_LIFT_Z_ABSOLUTE Z=25 F={15 * 60} ; park 25mm above build plate
    #STATUS_HEATING
    PARK_CENTER                           ; place tool head in the middle of the print volume for even frame heating

    # wait for top bed sensor to be in thermal equilibrium:
    HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor top_bed' CANCEL='CANCEL_PRINT'

[gcode_macro _PRINT_WARMUP]
variable_bed_temp: 0
variable_extruder_temp: 0
gcode:
    {% set warmup = printer['gcode_macro _PRINT_WARMUP'] %}
    PRINT_WARMUP EXTRUDER_TEMP={warmup.extruder_temp} BED_TEMP={warmup.bed_temp}

[gcode_macro PRINT_START]
description: perform calibration and get ready to print
variable_parameter_EXTRUDER_TEMP : 0
variable_parameter_BED_TEMP : 0
variable_parameter_PRINT_START_X : 0
variable_parameter_PRINT_START_Y : 0
variable_parameter_PRINT_END_X : 0
variable_parameter_PRINT_END_Y : 0
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set safe_max_x = 285 %}
    {% set start_x = params.PRINT_START_X|default(0)|float %}
    {% set start_x = [start_x, safe_max_x]|min %}
    {% set start_y = params.PRINT_START_Y|default(0)|float %}
    # Enlarge the start area as needed to contain the purge line:
    {% set start_y = start_y - 3 %}

    CLEAR_PAUSE
    # clear any offset before probing
    SET_GCODE_OFFSET Z=0.0

    #######
    # This section is a duplicate of what happens in the warmup to guard against old prints that only call PRINT_START
    # generally the printer will pass through this almost instantly
    M109 S140                            ; load cell requires warm nozzle, 140 is safe from ooze
    M190 S{BED_TEMP}                     ; set bed temprature and wait (for safety only!)
    ;M106 S64                            ; Enable the part cooling fan to keep the probe and cooling ducts cool during heat-up
    #######

    # clear bed mesh, do QGL on temp stable bed
    G32

    # mesh bed level
    #STATUS_MESHING
    # warm up to filament specific probing temp and wait
    M104 S{printer.extruder.filament.probe_temp}
    # go to parking location
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    PARK_OOZING
    # wait for heating
    M109 S{printer.extruder.filament.probe_temp}
    # Scrub for drool
    SCRUB_NOZZLE
    # throw away probe in the out of bounds area to clear nozzle:
    TAP_CHECK PRINT_START_X={start_x} PRINT_START_Y={start_y}
    # reset nozzle correction to 0 at this temp
    SET_Z_THERMAL_ADJUST COMPONENT="nozzle" REF_TEMP={printer.extruder.filament.probe_temp}
    # bed mesh
    BED_MESH_CALIBRATE ADAPTIVE=1
    APPLY_BUILD_SHEET_ADJUSTMENT
    ; move to the front of the printer to allow user to remove any oozing
    M104 S{EXTRUDER_TEMP}                ; Start heating nozzle to printing temp
    PARK_OOZING                          ; Move tool head to back neat nozzle brush for ooze 
    M109 S{EXTRUDER_TEMP}                ; Wait for nozzle to finish heating
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    _DERETRACT_AND_PURGE
    SCRUB_NOZZLE RETURN=0

    # ready to go print
    PURGE_LINE PRINT_START_X={start_x} PRINT_START_Y={start_y}
    ; if a callback was supplied to print_start, call it
    {% set print_start_macro = printer['gcode_macro PRINT_START'] %}
    {% if print_start_macro.callback  %}
        {print_start_macro.callback}
    {% endif %}

[gcode_macro _PRINT_START]
variable_bed_temp: 0
variable_extruder_temp: 0
variable_print_start_x: 0
variable_print_start_y: 0
gcode:
  {% set start = printer['gcode_macro _PRINT_START'] %}
  PRINT_START EXTRUDER_TEMP={start.extruder_temp} BED_TEMP={start.bed_temp} PRINT_START_X={start.print_start_x} PRINT_START_Y={start.print_start_y}

[gcode_macro _SETUP_PRINT_START]
variable_parameter_EXTRUDER_TEMP : 0
variable_parameter_BED_TEMP : 0
variable_parameter_PRINT_START_X : 0
variable_parameter_PRINT_START_Y : 0
gcode:
    # configure _PRINT_WARMUP variables
    SET_GCODE_VARIABLE MACRO=_PRINT_WARMUP VARIABLE=extruder_temp VALUE={params.EXTRUDER_TEMP}
    SET_GCODE_VARIABLE MACRO=_PRINT_WARMUP VARIABLE=bed_temp VALUE={params.BED_TEMP}

    # configure print start
    SET_GCODE_VARIABLE MACRO=_PRINT_START VARIABLE=extruder_temp VALUE={params.EXTRUDER_TEMP}
    SET_GCODE_VARIABLE MACRO=_PRINT_START VARIABLE=bed_temp VALUE={params.BED_TEMP}
    SET_GCODE_VARIABLE MACRO=_PRINT_START VARIABLE=print_start_x VALUE={params.PRINT_START_X}
    SET_GCODE_VARIABLE MACRO=_PRINT_START VARIABLE=print_start_y VALUE={params.PRINT_START_Y}

[gcode_macro PRINT_END]
description: tasks to rese the printer state and cool everything down.
gcode:
    M400                           ; wait for move buffer to clear
    _RETRACT_BEFORE_PROBING        ; stop oozing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    SET_GCODE_OFFSET Z=0.0
    SAFE_LIFT_Z Z=50 F={15 * 60}
    PARK_REAR
    # TODO: it would be nice to keep the part cooling fan on until the hot end fan shuts off.

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    STOP_HEAT_SOAK
    _RETRACT_BEFORE_PROBING
    TURN_OFF_HEATERS
    M107
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    SET_GCODE_OFFSET Z=0.0
    SAFE_LIFT_Z Z=50 F={15 * 60}
    PARK_REAR
    BASE_CANCEL_PRINT

; catch M600 from Prusa Slicer to allow a manual color change
[gcode_macro M600]
gcode:
    PAUSE
    # TODO: add retract here
    SAFE_LIFT_Z Z=10 F={15 * 60}
    PARK_FRONT

[gcode_macro PID_CALIBRATE_EXTRUDER]
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=250 WRITE_FILE=1

[gcode_macro PID_CALIBRATE_HEATER_BED]
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=100 WRITE_FILE=1

[gcode_macro TEST_PROBE_Z_CORNERS]
gcode:
    SAVE_GCODE_STATE NAME=TEST_PROBE_CORNERS
    G90
    G0 X93 Y25 F18000
    PROBE_ACCURACY
    G0 X93 Y225 F18000
    PROBE_ACCURACY
    G0 X293 Y225 F18000
    PROBE_ACCURACY
    G0 X293 Y25 F18000
    PROBE_ACCURACY
    RESTORE_GCODE_STATE NAME=TEST_PROBE_CORNERS

[gcode_macro DUMP_TEST]
gcode:
    {% set extruder = printer.toolhead.extruder %}
    {action_respond_info("extruder name: %s" % (extruder))}
    {action_respond_info("extruer object: %s" % (printer[extruder] | pprint | string))}
    {action_respond_info("bed temp: %f" % ((printer[extruder]).filament.bed))}
    {action_respond_info("extruder temp: %f" % ((printer[extruder]).filament.extruder))}
    {action_respond_info("nozzle diameter: %f" % ((printer[extruder]).nozzle_diameter))}

