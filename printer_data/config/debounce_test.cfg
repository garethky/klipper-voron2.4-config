[gcode_button test_button_true]
pin: ESTOP3
press_gcode:
    {action_respond_info("Button True Pressed")}
release_gcode:
    {action_respond_info("Button True Released")}
debounce_delay: 3.0

[gcode_button test_button]
pin: !ESTOP2
press_gcode:
    {action_respond_info("Button False Pressed")}
release_gcode:
    {action_respond_info("Button False Released")}
debounce_delay: 3.0

[filament_switch_sensor filament_sw]
switch_pin: !ESTOP4
runout_gcode:
    {action_respond_info("Filament True: Runout Detected")}
insert_gcode:
    {action_respond_info("Filament True: Filament Insertion Detected")}
event_delay: 0.0
debounce_delay: 4.0

[filament_switch_sensor filament_sw]
switch_pin: ESTOP6  #ESTOP5
runout_gcode:
    {action_respond_info("Filament False: Runout Detected")}
insert_gcode:
    {action_respond_info("Filament False: Filament Insertion Detected")}
event_delay: 0.0
debounce_delay: 4.0