
[gcode_macro _SET_CASE_LIGHTS]
variable_parameter_VALUE : 0.0
gcode:
    {% set VALUE = params.VALUE|default(0.0)|float %}
    SET_PIN PIN=left_case_light VALUE={VALUE}
    SET_PIN PIN=right_case_light VALUE={VALUE}
    SET_PIN PIN=gantry_light VALUE={VALUE}

[gcode_macro _SET_CASE_LIGHTS_BRIGHT]
gcode:
    SET_PIN PIN=left_case_light VALUE=0.3
    SET_PIN PIN=right_case_light VALUE=0.3
    SET_PIN PIN=gantry_light VALUE=0.25

[gcode_macro _SET_CASE_LIGHTS_DIM]
gcode:
    SET_PIN PIN=left_case_light VALUE=0.03
    SET_PIN PIN=right_case_light VALUE=0.03
    SET_PIN PIN=gantry_light VALUE=0.015

[gcode_macro _SET_CASE_LIGHTS_OFF]
gcode:
    _SET_CASE_LIGHTS VALUE=0.0